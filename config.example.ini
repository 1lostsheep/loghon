# Loghon Kiosk settings.
# Your own copy lives in ~/.config/loghon-kiosk/config.ini (created on first run).
# Edit that copy, not this file. Never commit a file with the real password.

[account]
# Page the app opens first (Loghon's web app; www.loghon.com is only the info site).
start_url = https://app.loghon.com/
# Optional: the page where translations are started, if it is not the start page
# (copy it from the browser's address bar once you are logged in).
translation_url =
# Login. Loghon's login page has a Cloudflare "I'm human" check, so an
# automatic login may be refused. Best: leave these empty and use
# "Log in once…" in the app; the login is remembered in the app's own browser
# profile. If Loghon ever asks again, START opens a login window and waits
# until you have logged in and closed it.
# Environment variables LOGHON_USERNAME / LOGHON_PASSWORD override these.
username =
password =

[screen]
# Text for the audience. Leave empty for the default:
#   title = Live-Übersetzung
#   subtitle = QR-Code mit der Handykamera scannen
title =
subtitle =
fullscreen = yes
# Show the QR code from the last translation while nothing is running
# (only useful if Loghon keeps the same code for every session).
show_last_qr_at_startup = no

[browser]
# Where the Loghon browser window goes while a translation runs:
#   offscreen  - real window, moved off the screen (most reliable for the mic)
#   minimized  - real window, minimized
#   visible    - normal window (useful while setting things up)
#   headless   - no window at all (microphone may not work on every system)
mode = offscreen
# Leave empty to use Playwright's Chromium. To use installed Chrome instead:
# chrome_channel = chrome
chrome_path =
chrome_channel =
# Extra Chromium command-line switches, separated by spaces.
extra_args =
step_timeout_seconds = 30
qr_refresh_seconds = 10

[labels]
# The app finds things on the Loghon page by their visible text.
# If Loghon uses different words, change them here (comma separated,
# tried in order, not case sensitive; one-word labels must match exactly).
login_buttons = Log in, Login, Sign in
login_submit_buttons = Log in, Login, Sign in, Continue, Submit
# Buttons to click (if present) before the settings, e.g. "New translation".
pre_start_buttons =
# The switch/checkbox that turns on audio output.
audio_labels = Audio, Enable audio, Audio output, Speech, Voice
start_buttons = Start translation, Start Translation, Start translating, Start session, Start
# Clicked if present right after Start (e.g. a "Begin" confirm).
after_start_buttons =
# Clicked if the QR code is not shown by itself.
show_qr_buttons = Show QR code, QR code, QR, Share
# CSS selectors for the QR code, tried before the built-in guesses.
qr_selectors =
stop_buttons = Stop translation, Stop Translation, End translation, Stop session, End session, Stop, End
# Clicked if a "Are you sure?" box appears after Stop.
confirm_stop_buttons = Yes, Confirm, End, Stop, OK
